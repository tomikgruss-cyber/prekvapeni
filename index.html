<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>prekvapko</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #fff;
      perspective: 1000px;
    }

    /* Plátno pro padající konfety */
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 50;
    }

    /* Přihlašovací okno */
    .login-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 40px;
      width: 360px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
      z-index: 10;
    }

    .login-card h2 { margin-bottom: 24px; font-size: 26px; }

    .input-group { margin-bottom: 18px; }

    .input-group input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #f43f5e, #fb7185);
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4);
    }

    .error-msg { color: #fb7185; font-size: 13px; margin-top: 12px; display: none; }

    /* 3D Dárek */
    .gift-wrapper {
      display: none;
      flex-direction: column;
      align-items: center;
      z-index: 10;
      cursor: pointer;
    }

    .gift-3d {
      width: 140px;
      height: 140px;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(-20deg) rotateY(-30deg);
      transition: transform 0.2s ease;
      margin-bottom: 40px;
    }

    /* Stěny dárku */
    .face {
      position: absolute;
      width: 140px;
      height: 140px;
      background: #e11d48;
      border: 2px solid #be123c;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
    }

    /* Stuha */
    .face::before {
      content: '';
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 30px; height: 100%;
      background: #fbbf24;
    }

    .face.front  { transform: translateZ(70px); }
    .face.back   { transform: rotateY(180deg) translateZ(70px); }
    .face.right  { transform: rotateY(90deg) translateZ(70px); }
    .face.left   { transform: rotateY(-90deg) translateZ(70px); }
    .face.bottom { transform: rotateX(-90deg) translateZ(70px); background: #9f1239; }

    /* Víko dárku */
    .lid {
      position: absolute;
      width: 150px;
      height: 40px;
      top: -10px;
      left: -5px;
      transform-style: preserve-3d;
      transform-origin: back;
      transition: transform 1s ease-in-out;
    }

    .lid-face {
      position: absolute;
      background: #f43f5e;
      border: 1px solid #be123c;
    }

    .lid-top {
      width: 150px; height: 150px;
      transform: rotateX(90deg) translateZ(70px);
      background: #e11d48;
    }

    .lid-top::before, .lid-top::after {
      content: '';
      position: absolute;
      background: #fbbf24;
    }
    .lid-top::before { top: 0; left: 60px; width: 30px; height: 100%; }
    .lid-top::after  { top: 60px; left: 0; width: 100%; height: 30px; }

    .lid-front { width: 150px; height: 30px; transform: translateZ(75px); }
    .lid-back  { width: 150px; height: 30px; transform: rotateY(180deg) translateZ(75px); }
    .lid-left  { width: 150px; height: 30px; transform: rotateY(-90deg) translateZ(75px); }
    .lid-right { width: 150px; height: 30px; transform: rotateY(90deg) translateZ(75px); }

    /* Otevření víka */
    .gift-3d.open .lid {
      transform: rotateX(-110deg) translateY(-20px);
    }

    /* Světlo vyzařující zvnítřku dárku */
    .inner-light {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      background: radial-gradient(circle, #ffffff 0%, #fef08a 40%, rgba(244, 63, 94, 0) 70%);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      z-index: 20;
      opacity: 0;
      transition: transform 2.5s cubic-bezier(0.1, 0.7, 0.1, 1), opacity 1s ease;
    }

    .inner-light.expand {
      opacity: 1;
      transform: translate(-50%, -50%) scale(250);
    }

    /* Animace zatřesení 3D dárku */
    .shake-3d {
      animation: shake3D 0.3s ease-in-out;
    }

    @keyframes shake3D {
      0% { transform: rotateX(-20deg) rotateY(-30deg) scale(1); }
      25% { transform: rotateX(-25deg) rotateY(-40deg) scale(1.05); }
      75% { transform: rotateX(-15deg) rotateY(-20deg) scale(1.05); }
      100% { transform: rotateX(-20deg) rotateY(-30deg) scale(1); }
    }

    .gift-hint {
      font-size: 16px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

    /* Otáčecí karta s Pohlreichem */
    .card-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0) rotate(0deg);
      z-index: 30;
      opacity: 0;
      pointer-events: none;
    }

    .card-container.reveal {
      animation: spinAndScale 3.5s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
      pointer-events: auto;
    }

    @keyframes spinAndScale {
      0% { transform: translate(-50%, -50%) scale(0.1) rotate(0deg); opacity: 0; }
      30% { opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1) rotate(1440deg); opacity: 1; }
    }

    .card {
      background: #ffffff;
      color: #1e293b;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 380px;
      width: 90vw;
    }

    .card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      object-position: top;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .card h3 { font-size: 22px; color: #e11d48; margin-bottom: 10px; }
    .card p { font-size: 16px; line-height: 1.5; color: #475569; font-weight: 500; }
  </style>
</head>
<body>

  <canvas id="confettiCanvas"></canvas>

  <!-- Přihlašovací okno -->
  <div class="login-card" id="loginCard">
    <h2>Zadej jméno a heslo</h2>
    <div class="input-group">
      <input type="text" id="username" placeholder="Uživatelské jméno">
    </div>
    <div class="input-group">
      <input type="password" id="password" placeholder="Heslo">
    </div>
    <button class="btn-login" onclick="login()">Otevřít</button>
    <div class="error-msg" id="errorMsg">Nesprávné jméno nebo heslo!</div>
  </div>

  <!-- 3D Dárek -->
  <div class="gift-wrapper" id="giftWrapper" onclick="clickGift()">
    <div class="gift-3d" id="gift3d">
      <div class="face front"></div>
      <div class="face back"></div>
      <div class="face right"></div>
      <div class="face left"></div>
      <div class="face bottom"></div>
      
      <div class="lid">
        <div class="lid-face lid-top"></div>
        <div class="lid-face lid-front"></div>
        <div class="lid-face lid-back"></div>
        <div class="lid-face lid-left"></div>
        <div class="lid-face lid-right"></div>
      </div>

      <!-- Světelný zdroj uvnitř dárku -->
      <div class="inner-light" id="innerLight"></div>
    </div>
    <div class="gift-hint" id="giftHint">Klikni na dárek pro otevření!</div>
  </div>

  <!-- Otáčející se karta -->
  <div class="card-container" id="cardContainer">
    <div class="card">
      <!-- Funkční přímý odkaz na Zdeňka Pohlreicha -->
      <img src="pohlreich.jpg">
      <h3>Gratuluju! 🎉</h3>
      <p>Vyhráváš pozvánku na večeři! Výběr restaurace i termínu je plně na tobě. </p>
    </div>
  </div>

  <script>
    let clickCount = 0;
    const requiredClicks = 5;

    function login() {
      const user = document.getElementById('username').value.trim().toLowerCase();
      const pass = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('errorMsg');

      if (user === 'sofi' && pass === 'špunt') {
        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('giftWrapper').style.display = 'flex';
      } else {
        errorMsg.style.display = 'block';
      }
    }

    function clickGift() {
      const gift3d = document.getElementById('gift3d');
      const giftHint = document.getElementById('giftHint');
      
      clickCount++;

      gift3d.classList.remove('shake-3d');
      void gift3d.offsetWidth;
      gift3d.classList.add('shake-3d');

      giftHint.innerText = `Ještě ${requiredClicks - clickCount}x...`;

      if (clickCount >= requiredClicks) {
        openGift();
      }
    }

    function openGift() {
      const giftWrapper = document.getElementById('giftWrapper');
      const gift3d = document.getElementById('gift3d');
      const innerLight = document.getElementById('innerLight');
      const cardContainer = document.getElementById('cardContainer');

      giftWrapper.onclick = null;
      document.getElementById('giftHint').style.opacity = '0';

      // 1. Odklopení víka 3D dárku
      gift3d.classList.add('open');

      // 2. Světlo vyzáří zvnítřku dárku přes celou obrazovku
      setTimeout(() => {
        innerLight.classList.add('expand');
      }, 400);

      // 3. Vynoření vytočené kartičky a odpal konfet
      setTimeout(() => {
        cardContainer.classList.add('reveal');
        setTimeout(startConfetti, 1800);
      }, 1200);
    }

    /* Konfety */
    function startConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      const ctx = canvas.getContext('2d');
      
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const confetti = [];
      const colors = ['#f43f5e', '#fb7185', '#38bdf8', '#34d399', '#fbbf24', '#a855f7'];

      for (let i = 0; i < 150; i++) {
        confetti.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          speedY: Math.random() * 3 + 2,
          speedX: Math.random() * 2 - 1,
          rotation: Math.random() * 360,
          rotationSpeed: Math.random() * 10 - 5
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        confetti.forEach((p) => {
          p.y += p.speedY;
          p.x += p.speedX;
          p.rotation += p.rotationSpeed;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();

          if (p.y > canvas.height) {
            p.y = -10;
            p.x = Math.random() * canvas.width;
          }
        });

        requestAnimationFrame(animate);
      }

      animate();
    }
  </script>
</body>
</html>
